[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-byok"
version = "1.0.0"
description = "Keep bring-your-own-key working in Cursor across updates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fa-h" }]
keywords = ["cursor", "byok", "patch", "llm", "openai-compatible"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cursor-byok = "cursor_byok.cli:main"

[project.urls]
Homepage = "https://github.com/fahmiirsyadk/ccursor"
Issues = "https://github.com/fahmiirsyadk/ccursor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
